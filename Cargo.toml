[package]
name = "aion_verify"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
license = "MPL-2.0"
description = "A two-tier proof engine: tier 4 checks a predicate against EVERY input in a bounded domain (exhaustive, not sampling); tier 5 proves properties over UNBOUNDED domains (all of u64) symbolically via interval abstract interpretation — Proven / Refuted-with-witness / honest Unknown, never a false result. Pure Rust, no_std, no unsafe, no external solver. A first-party alternative to symbolic model checkers like Kani."
repository = "https://github.com/MattGelfman/aion_verify"
documentation = "https://docs.rs/aion_verify"
readme = "README.md"
keywords = ["verification", "proof", "property-testing", "no-std", "testing"]
categories = ["development-tools::testing", "no-std", "algorithms"]

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
